name: Format migration source

on:
  push:
    branches: [feat/universal-email-mcp]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: feat/universal-email-mcp

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Format source
        run: |
          npm ci
          npx oxfmt --write src/migration.ts

      - name: Commit formatting
        run: |
          if git diff --quiet -- src/migration.ts; then
            echo "Migration source already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/migration.ts
          git commit -m "style: format credential migration executor"
          git push origin HEAD:feat/universal-email-mcp
