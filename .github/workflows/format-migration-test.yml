name: Format migration test

on:
  push:
    branches: [feat/universal-email-mcp]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: feat/universal-email-mcp

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Format migration test
        run: |
          npm ci
          npx oxfmt --write tests/secrets-store-migration.test.ts

      - name: Commit formatting
        run: |
          if git diff --quiet -- tests/secrets-store-migration.test.ts; then
            echo "Migration test already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/secrets-store-migration.test.ts
          git commit -m "style: format Secrets Store migration test"
          git push origin HEAD:feat/universal-email-mcp
