name: Format generated Worker types

on:
  push:
    branches: [feat/universal-email-mcp]

permissions:
  contents: write

jobs:
  format-generated-types:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: feat/universal-email-mcp

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Format generated declaration
        run: |
          npm ci
          npx oxfmt --write worker-configuration.d.ts

      - name: Commit formatting
        run: |
          if git diff --quiet -- worker-configuration.d.ts; then
            echo "Generated declaration already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker-configuration.d.ts
          git commit -m "style: format generated Worker types"
          git push origin HEAD:feat/universal-email-mcp
