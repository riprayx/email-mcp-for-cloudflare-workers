name: Regenerate Worker types

on:
  push:
    branches: [feat/universal-email-mcp]

permissions:
  contents: write

jobs:
  typegen:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: feat/universal-email-mcp

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Regenerate Worker types
        run: |
          npm ci
          npm run cf-typegen

      - name: Commit generated declarations
        run: |
          if git diff --quiet -- worker-configuration.d.ts; then
            echo "Worker types already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker-configuration.d.ts
          git commit -m "chore: regenerate Worker types"
          git push origin HEAD:feat/universal-email-mcp
