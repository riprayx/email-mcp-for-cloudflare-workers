name: Format feature branch

on:
  push:
    branches: [feat/universal-email-mcp]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: feat/universal-email-mcp

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and format
        run: |
          npm install --no-audit --no-fund
          npm run format

      - name: Commit formatted files
        run: |
          git restore .github/workflows/format-feature.yml
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format OAuth feature branch"
          git push origin HEAD:feat/universal-email-mcp
