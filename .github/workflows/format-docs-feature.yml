name: Format updated docs

on:
  push:
    branches: [feat/universal-email-mcp]

permissions:
  contents: write

jobs:
  format-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: feat/universal-email-mcp

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Format docs
        run: |
          npm ci
          npx oxfmt --write README.md docs/UNIVERSAL_EMAIL.md

      - name: Commit formatting
        run: |
          if git diff --quiet -- README.md docs/UNIVERSAL_EMAIL.md; then
            echo "Docs already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/UNIVERSAL_EMAIL.md
          git commit -m "style: format split deployment docs"
          git push origin HEAD:feat/universal-email-mcp
